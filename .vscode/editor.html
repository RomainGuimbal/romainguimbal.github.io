<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/colors.css" />
    <title>Portfolio Editor</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background-color: var(--page-bg-color);

        /* Dots */
        background-image: radial-gradient(
          color-mix(in srgb, var(--page-bg-color) 93%, white) 0.08em,
          transparent 0
        );
        background-size: 30px 30px;

        color: #1a1a1a;
        min-height: 100vh;
      }

      /* ── Layout ── */
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #fff;
        border-bottom: 1px solid #e0e0dc;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        flex: 1;
      }
      main {
        max-width: 450px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }

      /* ── Buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          opacity 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn:active {
        opacity: 0.7;
      }
      .btn-primary {
        background: #1a1a1a;
        color: #fff;
      }
      .btn-secondary {
        background: #fff;
        color: #1a1a1a;
        border: 1px solid #d0d0cc;
      }
      .btn-danger {
        background: #fff;
        color: #c0392b;
        border: 1px solid #f5c6c2;
      }
      .btn-apply {
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        padding: 10px 24px;
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 6px;
      }

      /* ── Status bar ── */
      #status {
        font-size: 13px;
        color: #666;
        padding: 6px 14px;
        border-radius: 6px;
        background: transparent;
        transition:
          background 0.2s,
          color 0.2s;
      }
      #status.ok {
        background: #ecfdf5;
        color: #065f46;
      }
      #status.error {
        background: #fef2f2;
        color: #991b1b;
      }

      /* ── Card list ── */
      #card-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      /* ── Project card ── */
      .grid-item {
        background: #fff;
        border: 1px solid #e0e0dc;
        border-radius: 12px;
        overflow: hidden;
        transition: box-shadow 0.15s;
      }
      .grid-item:hover {
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 16px;
        background: #fafaf8;
        border-bottom: 1px solid #e0e0dc;
        cursor: pointer;
        user-select: none;
      }
      .card-header .card-title-preview {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
        color: #1a1a1a;
      }
      .card-header .card-title-preview.untitled {
        color: #999;
        font-style: italic;
      }
      .card-chevron {
        font-size: 11px;
        color: #999;
        transition: transform 0.2s;
      }
      .grid-item.open .card-chevron {
        transform: rotate(180deg);
      }

      .card-body {
        padding: 16px;
        display: none;
        flex-direction: column;
        gap: 14px;
      }
      .grid-item.open .card-body {
        display: flex;
      }

      /* ── Form fields ── */
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label {
        font-size: 12px;
        font-weight: 500;
        color: #555;
      }
      .field input[type="text"],
      .field input[type="url"],
      .field textarea {
        padding: 8px 11px;
        border: 1px solid #d0d0cc;
        border-radius: 7px;
        font-size: 13px;
        font-family: inherit;
        color: #1a1a1a;
        background: #fff;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }
      textarea {
        min-height: 72px;
      }

      /* ── Image upload ── */
      .image-upload-area {
        border: 1.5px dashed #c8c8c4;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
        position: relative;
      }
      .image-upload-area:hover,
      .image-upload-area.drag-over {
        border-color: #2563eb;
        background: #f0f5ff;
      }
      .image-upload-area input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }
      .image-upload-area .upload-hint {
        font-size: 13px;
        color: #888;
        pointer-events: none;
      }
      .image-preview {
        margin-top: 10px;
        display: none;
        position: relative;
        border-radius: 7px;
        overflow: hidden;
      }
      .image-preview img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
        border-radius: 7px;
        border: 1px solid #e0e0dc;
      }
      .image-preview .remove-image {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Tags field ── */
      .tag-options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tag-option {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid #d0d0cc;
        border-radius: 999px;
        background: #f8f8f6;
        color: #4b5563;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s,
          color 0.15s;
      }
      .tag-option.selected {
        background: #eef4ff;
        border-color: #93c5fd;
        color: #1e3a8a;
      }
      .tag-option input {
        margin: 0;
        accent-color: #2563eb;
      }

      /* ── Card footer ── */
      .card-footer {
        display: flex;
        justify-content: flex-end;
        padding-top: 4px;
      }

      /* ── Add project button ── */
      #add-btn-wrap {
        text-align: center;
      }

      /* ── Upload progress ── */
      .upload-progress {
        font-size: 12px;
        color: #2563eb;
        margin-top: 6px;
        display: none;
      }

      /* ── Drag handle ── */
      .drag-handle {
        cursor: grab;
        color: #bbb;
        font-size: 16px;
        padding: 0 2px;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
      .grid-item.dragging {
        opacity: 0.4;
      }

      /* ── Empty state ── */
      #empty-state {
        text-align: center;
        padding: 48px 24px;
        color: #999;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Portfolio Editor</h1>
      <span id="status"></span>
      <button class="btn btn-secondary" onclick="loadProjects()">
        ↺ Reload
      </button>
      <button class="btn btn-secondary" onclick="regenerateThumbnails()">
        ♻ Regenerate thumbnails
      </button>
      <button class="btn btn-apply" onclick="applyChanges()">
        Apply changes
      </button>
    </header>

    <main>
      <!-- Add button at the top: new projects appear first -->
      <div id="add-btn-wrap" style="margin-bottom: 16px">
        <button class="btn btn-primary" onclick="addProject()">
          + Add project
        </button>
      </div>
      <div id="card-list"></div>
      <div id="empty-state">No projects yet. Add your first one above.</div>
    </main>

    <script>
      // ─── State ───────────────────────────────────────────────────────────────────
      let projects = [];
      const AVAILABLE_TAGS = [
        "product",
        "graphic",
        "rendering",
        "programming",
        "vfx",
        "modeling",
        "animation",
        "procedural",
        "painting",
      ];

      // ─── Boot ────────────────────────────────────────────────────────────────────
      loadProjects();

      async function loadProjects() {
        try {
          setStatus("Loading…");
          const res = await fetch("/projects");
          if (!res.ok) throw new Error(await res.text());
          projects = await res.json();
          renderAll();
          setStatus("Loaded", "ok");
        } catch (e) {
          setStatus("Error loading: " + e.message, "error");
        }
      }

      async function regenerateThumbnails() {
        try {
          setStatus("Regenerating thumbnails…");
          const res = await fetch("/regenerate-thumbnails", { method: "POST" });
          if (!res.ok) throw new Error(await res.text());

          const data = await res.json();
          if (Array.isArray(data.projects)) {
            projects = data.projects;
          }
          renderAll();
          setStatus(
            `Regenerated ${data.count || 0} thumbnail${(data.count || 0) === 1 ? "" : "s"} ✓`,
            "ok",
          );
        } catch (e) {
          setStatus("Error: " + e.message, "error");
        }
      }

      // ─── Render ──────────────────────────────────────────────────────────────────
      function renderAll() {
        const list = document.getElementById("card-list");
        const empty = document.getElementById("empty-state");
        list.innerHTML = "";

        if (projects.length === 0) {
          empty.style.display = "block";
          return;
        }
        empty.style.display = "none";

        // Associate every project with its item-page placeholder link
        projects.forEach((p, i) => {
          if (!p.link) p.link = itemPagePath(p, i);
        });

        projects.forEach((p, i) => list.appendChild(buildCard(p, i)));
        initDragSort();
      }

      function buildCard(project, index) {
        const card = document.createElement("div");
        card.className = "grid-item";
        card.dataset.index = index;

        // ── Determine display title ──
        const titleText = project.title || "";

        card.innerHTML = `
    <div class="card-header" onclick="toggleCard(this)">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <span class="card-title-preview ${titleText ? "" : "untitled"}">
        ${titleText || "Untitled project"}
      </span>
      <span class="card-chevron">▼</span>
    </div>

    <div class="card-body">

      <!-- MEDIA TYPE -->
      <div class="field">
        <label>Media Type</label>
        <select style="padding: 8px 11px; border: 1px solid #d0d0cc; border-radius: 7px; font-size: 13px; cursor: pointer;"
                onchange="updateField(${index},'mediaType',this.value)">
          <option value="image" ${project.mediaType !== "video" ? "selected" : ""}>Image</option>
          <option value="video" ${project.mediaType === "video" ? "selected" : ""}>Video</option>
        </select>
      </div>

      <!-- IMAGE UPLOAD -->
      <div class="field" id="image-upload-field-${index}" style="${project.mediaType === "video" ? "display:none" : ""}">
        <label>Original image</label>
        <div class="image-upload-area" id="upload-area-${index}"
             ondragover="handleDragOver(event,${index})"
             ondragleave="handleDragLeave(event,${index})"
             ondrop="handleDrop(event,${index})">
          <input type="file" accept="image/*" onchange="handleImageSelect(event,${index})"/>
          <div class="upload-hint">Drop the original image here. A thumbnail will be generated automatically.</div>
        </div>
        <div class="upload-progress" id="upload-progress-${index}">Uploading…</div>
        <div class="image-preview" id="preview-${index}"
             style="${project.thumb ? "display:block" : ""}">
          <img src="${project.thumb || ""}" alt="preview" />
          <button class="remove-image" onclick="removeImage(${index})" title="Remove image">✕</button>
        </div>
      </div>

      <!-- VIDEO UPLOAD -->
      <div class="field" id="video-upload-field-${index}" style="${project.mediaType !== "video" ? "display:none" : ""}">
        <label>Original video</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="file" accept="video/*" onchange="handleVideoSelect(event,${index})" />
          <input type="text" 
                 value="${esc(project.full || "")}" 
                 placeholder="Or paste path like assets/video/myVideo.mp4"
                 oninput="updateField(${index},'full',this.value)" style="flex:1" />
        </div>
        <small style="color: #999; font-size: 11px; margin-top: 4px; display: block;">Drop or choose the original video file; a thumbnail will be generated automatically.</small>
      </div>

      <!-- ASPECT RATIO (VIDEO ONLY) -->
      <div class="field" id="aspect-ratio-field-${index}" style="${project.mediaType !== "video" ? "display:none" : ""}">
        <label>Aspect Ratio</label>
        <select style="padding: 8px 11px; border: 1px solid #d0d0cc; border-radius: 7px; font-size: 13px; cursor: pointer;"
                onchange="updateField(${index},'aspectRatio',this.value)">
          <option value="16/9" ${project.aspectRatio === "16/9" ? "selected" : ""}>16/9 (Landscape)</option>
          <option value="9/16" ${project.aspectRatio === "9/16" ? "selected" : ""}>9/16 (Portrait)</option>
          <option value="10/13" ${project.aspectRatio === "10/13" ? "selected" : ""}>10/13 (Tall)</option>
          <option value="1/1" ${project.aspectRatio === "1/1" ? "selected" : ""}>1/1 (Square)</option>
        </select>
      </div>

      <div class="field">
        <label>Title <span style="color:#c00">*</span></label>
        <input type="text" value="${esc(project.title)}"
               placeholder="Format like that no-cap"
               oninput="updateField(${index},'title',this.value)" />
      </div>

      <div class="field">
        <label>Year</label>
        <input type="number"
               min="2000" 
               max="2100" 
               step="1" 
               value="${esc(String(project.year ?? ""))}"
               oninput="updateField(${index},'year',this.value)" />
      </div>

      <div class="field">
        <label>Description</label>
        <textarea placeholder="A short description of the project…"
                  oninput="updateField(${index},'description',this.value)">${esc(project.description)}</textarea>
      </div>

      <div class="field">
        <label>Tags</label>
        <div class="tag-options" id="tag-options-${index}">
          ${renderTagOptions(project, index)}
        </div>
      </div>

      <div class="field">
        <label>Link (URL)</label>
        <input type="url" id="link-field-${index}" value="${esc(project.link)}"
               placeholder="../assets/html/items/my-project.html"
               oninput="updateField(${index},'link',this.value)" />
      </div>

      <!-- End of fields -->

      <div class="card-footer">
        <button class="btn btn-danger btn-sm" onclick="removeProject(${index})">Remove project</button>
      </div>
    </div>`;

        return card;
      }

      function renderTagOptions(project, index) {
        return AVAILABLE_TAGS.map((tag) => {
          const selected = hasTag(project, tag);
          return `
            <label class="tag-option ${selected ? "selected" : ""}">
              <input type="checkbox" ${selected ? "checked" : ""} onchange="toggleTag(${index}, '${tag}', this)" />
              <span>${esc(tag)}</span>
            </label>`;
        }).join("");
      }

      // ─── Toggle open/close ────────────────────────────────────────────────────────
      function toggleCard(header) {
        header.closest(".grid-item").classList.toggle("open");
      }

      // ─── Field updates ────────────────────────────────────────────────────────────
      function updateField(index, key, value) {
        const project = projects[index];
        // Path the placeholder link would have had with the current title
        const prevAutoLink =
          key === "title" ? itemPagePath(project, index) : null;

        project[key] = value;

        // Keep the header title preview in sync
        if (key === "title") {
          const card = document.querySelector(
            `.grid-item[data-index="${index}"]`,
          );
          const preview = card?.querySelector(".card-title-preview");
          if (preview) {
            preview.textContent = value || "Untitled project";
            preview.classList.toggle("untitled", !value);
          }

          // Keep the item-page placeholder link in sync with the title,
          // unless the user typed a custom link manually.
          if (!project.link || project.link === prevAutoLink) {
            project.link = itemPagePath(project, index);
            const linkInput = document.getElementById(`link-field-${index}`);
            if (linkInput) linkInput.value = project.link;
          }
        }

        // Toggle visibility of media type fields
        if (key === "mediaType") {
          const isVideo = value === "video";
          const showField = (id, show) => {
            const el = document.getElementById(`${id}-${index}`);
            if (el) el.style.display = show ? "" : "none";
          };
          showField("image-upload-field", !isVideo);
          showField("video-upload-field", isVideo);
          showField("aspect-ratio-field", isVideo);
        }
      }

      // ─── Image handling ───────────────────────────────────────────────────────────
      function handleDragOver(e, index) {
        e.preventDefault();
        document
          .getElementById("upload-area-" + index)
          .classList.add("drag-over");
      }

      function handleDragLeave(e, index) {
        document
          .getElementById("upload-area-" + index)
          .classList.remove("drag-over");
      }

      function handleDrop(e, index) {
        e.preventDefault();
        handleDragLeave(e, index);
        const file = e.dataTransfer.files[0];
        if (file) uploadImage(file, index);
      }

      function handleImageSelect(e, index) {
        const file = e.target.files[0];
        if (file) uploadImage(file, index);
      }

      function handleVideoSelect(e, index) {
        const file = e.target.files[0];
        if (file) uploadVideo(file, index);
      }

      async function uploadVideo(file, index) {
        const progress = document.getElementById("upload-progress-" + index);
        progress.style.display = "block";

        try {
          const formData = new FormData();
          formData.append("video", file);

          const res = await fetch("/upload-video", {
            method: "POST",
            body: formData,
          });
          if (!res.ok) throw new Error(await res.text());

          const { thumb, full } = await res.json();
          projects[index].thumb = thumb;
          projects[index].full = full;

          const preview = document.getElementById("preview-" + index);
          preview.querySelector("img").src = thumb + "?t=" + Date.now();
          preview.style.display = "block";
          setStatus("Video uploaded and thumbnail generated ✓", "ok");
        } catch (e) {
          setStatus("Upload failed: " + e.message, "error");
        } finally {
          progress.style.display = "none";
        }
      }

      async function uploadImage(file, index) {
        const progress = document.getElementById("upload-progress-" + index);
        progress.style.display = "block";

        try {
          const formData = new FormData();
          formData.append("image", file);

          const res = await fetch("/upload-image", {
            method: "POST",
            body: formData,
          });
          if (!res.ok) throw new Error(await res.text());

          const { thumb, full } = await res.json();
          projects[index].thumb = thumb;
          projects[index].full = full;

          const preview = document.getElementById("preview-" + index);
          preview.querySelector("img").src = thumb + "?t=" + Date.now();
          preview.style.display = "block";
          setStatus("Original media uploaded ✓", "ok");
        } catch (e) {
          setStatus("Upload failed: " + e.message, "error");
        } finally {
          progress.style.display = "none";
        }
      }

      function removeImage(index) {
        projects[index].thumb = "";
        projects[index].full = "";
        const preview = document.getElementById("preview-" + index);
        preview.style.display = "none";
        preview.querySelector("img").src = "";
      }

      // ─── Tags ─────────────────────────────────────────────────────────────────────
      function normalizeTags(tags) {
        if (!tags) return [];
        if (Array.isArray(tags)) {
          return tags
            .filter((tag) => typeof tag === "string")
            .map((tag) => tag.trim())
            .filter(Boolean);
        }
        if (typeof tags === "string") {
          return tags
            .split(",")
            .map((tag) => tag.trim())
            .filter(Boolean);
        }
        return [];
      }

      function hasTag(project, tag) {
        return normalizeTags(project.tags).includes(tag);
      }

      function toggleTag(index, tag, input) {
        const project = projects[index];
        if (!project) return;

        const tags = normalizeTags(project.tags);
        const tagIndex = tags.indexOf(tag);
        if (tagIndex >= 0) {
          tags.splice(tagIndex, 1);
        } else {
          tags.push(tag);
        }

        project.tags = tags;

        // Keep the chip's visual state in sync with the checkbox
        if (input) {
          const label = input.closest(".tag-option");
          label?.classList.toggle("selected", input.checked);
        }
      }

      // ─── Add / Remove projects ────────────────────────────────────────────────────
      function addProject() {
        // Insert at the top so the newest project is first
        projects.unshift({
          title: "",
          description: "",
          link: "",
          thumb: "",
          full: "",
          tags: [],
          mediaType: "image",
          aspectRatio: "16/9",
        });
        renderAll();

        // Auto-open the new (first) card
        const first = document.querySelector(".grid-item");
        first?.classList.add("open");
        first?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function removeProject(index) {
        if (!confirm(`Remove "${projects[index].title || "this project"}"?`))
          return;
        projects.splice(index, 1);
        renderAll();
      }

      // ─── Apply ───────────────────────────────────────────────────────────────────
      async function applyChanges() {
        // Basic validation
        // const missing = projects.filter((p) => !p.title?.trim());
        // if (missing.length) {
        //   setStatus("Every project needs a title.", "error");
        //   return;
        // }

        try {
          setStatus("Applying…");
          const res = await fetch("/apply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(projects),
          });
          if (!res.ok) throw new Error(await res.text());
          setStatus("index.html updated ✓ — ready to commit!", "ok");
        } catch (e) {
          setStatus("Error: " + e.message, "error");
        }
      }

      // ─── Drag-to-sort ─────────────────────────────────────────────────────────────
      function initDragSort() {
        const list = document.getElementById("card-list");
        let dragged = null;

        list.querySelectorAll(".drag-handle").forEach((handle) => {
          const card = handle.closest(".grid-item");

          // Only make the card draggable while the handle is pressed,
          // so text inside inputs stays selectable/editable.
          handle.addEventListener("mousedown", () => {
            card.draggable = true;
          });
          card.addEventListener("mouseup", () => {
            card.draggable = false;
          });

          card.addEventListener("dragstart", () => {
            dragged = card;
            setTimeout(() => card.classList.add("dragging"), 0);
          });

          card.addEventListener("dragend", () => {
            card.classList.remove("dragging");
            card.draggable = false;
            dragged = null;
            // Sync projects array to DOM order
            const newOrder = [...list.querySelectorAll(".grid-item")].map(
              (c) => projects[+c.dataset.index],
            );
            projects = newOrder;
            renderAll();
          });

          card.addEventListener("dragover", (e) => {
            e.preventDefault();
            if (dragged && dragged !== card) {
              const rect = card.getBoundingClientRect();
              const mid = rect.top + rect.height / 2;
              if (e.clientY < mid) {
                list.insertBefore(dragged, card);
              } else {
                list.insertBefore(dragged, card.nextSibling);
              }
            }
          });
        });
      }

      // ─── Item page placeholder link ─────────────────────────────────────────────
      // Each project is associated with its own page under ../assets/html/items/.
      // This is only a placeholder path — the page itself is created by the
      // backend when applying changes.
      function slugify(text) {
        return String(text || "")
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 60);
      }

      function itemPagePath(project, index) {
        const slug = slugify(project.title) || `project-${index + 1}`;
        return `../assets/html/items/${slug}.html`;
      }

      // ─── Helpers ──────────────────────────────────────────────────────────────────
      function esc(str = "") {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function setStatus(msg, type = "") {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.className = type;
        if (type === "ok")
          setTimeout(() => {
            if (el.className === "ok") el.textContent = "";
            el.className = "";
          }, 3000);
      }
    </script>
  </body>
</html>
